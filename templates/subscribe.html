<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Subscribe to email updates. Confirm your address to complete signup.">
<title>Subscribe · Letterform</title>
<style>
:root{--ink:#243027;--muted:#6f796e;--green:#1d7958;--lime:#d7ef80;--paper:#f4f6f0;--line:#e2e8de}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0%,#e8f1e2,transparent 50%),var(--paper);color:var(--ink);font:15px system-ui,-apple-system,'Segoe UI',sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:white;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 18px 60px #253b2910}.brand{display:flex;gap:10px;align-items:center;margin-bottom:31px}.logo{width:34px;height:34px;background:var(--lime);color:#283528;border-radius:11px;display:grid;place-items:center;font-weight:700}.brand b{font:600 19px Georgia,serif}.eyebrow{font-size:10px;color:var(--green);letter-spacing:1.5px;text-transform:uppercase;font-weight:700}h1{font:500 34px Georgia,serif;letter-spacing:-.6px;margin:8px 0}p{font-size:13px;color:var(--muted);line-height:1.65;margin:0 0 22px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:11px;font-weight:650;color:#556155}.field input{width:100%;border:1px solid #dfe5dc;border-radius:8px;padding:12px;font:inherit;font-size:13px;outline:none}.field input:focus{border-color:#7ca681;box-shadow:0 0 0 3px #1d795814}.consent{display:flex;align-items:flex-start;gap:9px;font-size:11px;line-height:1.55;color:#596457;margin:7px 0 18px}.consent input{margin-top:2px;accent-color:var(--green)}button{border:0;border-radius:8px;background:var(--green);color:white;padding:12px 15px;font-size:12px;font-weight:650;width:100%;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.fine{font-size:10px;color:#8b9389;text-align:center;margin:16px 0 0}.message{margin-top:14px;font-size:12px;line-height:1.5}.message.error{color:#aa4941}.message.success{background:#edf5e9;color:#42644a;padding:12px;border-radius:8px}.message a{color:#176b49;font-weight:650}.footer{margin-top:21px;border-top:1px solid #eef0ec;padding-top:14px;text-align:center;font-size:10px;color:#9aa196}
</style>
</head>
<body><main class="card"><div class="brand"><div class="logo">✳</div><b>Letterform</b></div><div class="eyebrow">A note from us</div><h1>Stay in the loop.</h1><p>Get occasional updates, useful ideas, and news from our team. Confirm your email address to finish signing up.</p>
<form id="signup"><div class="field"><label for="name">Your name <span style="font-weight:400;color:#879087">(optional)</span></label><input id="name" name="name" maxlength="120" autocomplete="name" placeholder="Jamie Rivera"></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com"></div><label class="consent"><input id="consent" type="checkbox" required><span>Yes, I want to receive email updates from Letterform. I understand I can unsubscribe at any time. I’ll need to confirm my email address before the subscription is active.</span></label><button id="submit" type="submit">Sign me up</button></form><div id="message" class="message" role="status" aria-live="polite"></div><div class="fine">We use your details only to send these updates and manage your preferences.</div><div class="footer">You’re in control of your inbox. Unsubscribe at any time.</div></main>
<script>
const form=document.getElementById('signup'),msg=document.getElementById('message'),btn=document.getElementById('submit');
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';msg.className='message';btn.disabled=true;btn.textContent='Submitting…';try{const r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,consent:document.getElementById('consent').checked})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Signup could not be completed.');msg.className='message success';msg.textContent=d.message+' ';if(d.confirmationUrl){const a=document.createElement('a');a.href=d.confirmationUrl;a.textContent='Open the confirmation page';msg.append(a)}form.reset()}catch(err){msg.className='message error';msg.textContent=err.message}finally{btn.disabled=false;btn.textContent='Sign me up'}});
</script></body></html>
